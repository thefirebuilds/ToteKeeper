name: Backend CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        working-directory: apps/api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install -r requirements.lock
      - run: pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test
      - run: python manage.py collectstatic --noinput
      - name: Compose smoke test
        env:
          POSTGRES_PASSWORD: ci-compose-only-password
        run: |
          cp .env.example .env
          echo 'POSTGRES_PASSWORD=ci-compose-only-password' >> .env
          docker compose build
          docker compose run --rm app python manage.py migrate --noinput
          docker compose up -d --wait
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8000/health/
      - if: always()
        run: docker compose down -v
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: octagon
          POSTGRES_USER: octagon
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U octagon"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DEBUG: 'true'
      POSTGRES_DB: octagon
      POSTGRES_USER: octagon
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
