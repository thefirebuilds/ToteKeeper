name: Deploy to IONOS

on: m,iom k,     
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Install SFTP deploy client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Validate deployment target
        env:
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          if [[ -z "$SFTP_REMOTE_DIR" ]]; then
            SFTP_REMOTE_DIR="."
          fi
          if [[ "$SFTP_REMOTE_DIR" != "." && "$SFTP_REMOTE_DIR" != "./" && ( ! "$SFTP_REMOTE_DIR" =~ ^(\./)?[A-Za-z0-9._/-]+$ || "$SFTP_REMOTE_DIR" == *".."* ) ]]; then
            echo "SFTP_REMOTE_DIR must be a safe path in the SFTP login directory, for example . or ./some-subdirectory."
            exit 1
          fi
          echo "SFTP_REMOTE_DIR=$SFTP_REMOTE_DIR" >> "$GITHUB_ENV"

      - name: Upload production build to IONOS
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          : "${SFTP_HOST:?Set the SFTP_HOST GitHub Actions secret}"
          : "${SFTP_USERNAME:?Set the SFTP_USERNAME GitHub Actions secret}"
          : "${SFTP_PASSWORD:?Set the SFTP_PASSWORD GitHub Actions secret}"
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          mirror --reverse --verbose --delete ./dist/ "$SFTP_REMOTE_DIR"
          EOF
