services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-octagon}
      POSTGRES_USER: ${POSTGRES_USER:-octagon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    image: octagon-app:${APP_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, manage.py, healthcheck]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  worker:
    image: octagon-app:${APP_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: [python, manage.py, run_jobs]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
