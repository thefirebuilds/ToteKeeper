<div class="table-wrap"><table><thead><tr><th>Tote</th><th>Nickname</th><th>Category</th><th>Status</th></tr></thead><tbody>{% for tote in totes %}<tr><td><a href="{% url 'tote' tote.pk %}">{{ tote.label }}</a></td><td>{{ tote.nickname|default:'—' }}</td><td>{{ tote.category|default:'—' }}</td><td><span class="badge">{{ tote.get_status_display }}</span></td></tr>{% empty %}<tr><td colspan="4">No totes assigned yet. Your operator will add them here.</td></tr>{% endfor %}</tbody></table></div>
