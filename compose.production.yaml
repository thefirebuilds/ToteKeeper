services:
  app:
    environment:
      DEBUG: 'false'
      USE_SQLITE: 'false'
  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
